<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WMS Pulse Prishtinë</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f6fa; --panel:#ffffff; --panel2:#eef2f7; --line:#d8e0ea; --text:#132033; --muted:#566b82; --faint:#8596aa;
  --accent:#1f6fd6; --accentbg:#e3eefc;
  --ok:#1d8f5c; --okbg:#e0f4ea; --warn:#a86b00; --warnbg:#fbf0d6; --crit:#c63434; --critbg:#fbe3e3;
  --s1:#1f6fd6; --s2:#d98a1c; --s3:#2a9d8f; --s4:#8a63d2;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --sans:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1720; --panel:#172536; --panel2:#1e3045; --line:#2c4058; --text:#e8eef5; --muted:#93a7bd; --faint:#6b8199;
  --accent:#4ea3ff; --accentbg:#16304d;
  --ok:#3ecf8e; --okbg:#123527; --warn:#f2b134; --warnbg:#3a2f10; --crit:#ff6b6b; --critbg:#3a1414;
  --s1:#4ea3ff; --s2:#f2a93b; --s3:#3cc5b5; --s4:#b08cff;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1720; --panel:#172536; --panel2:#1e3045; --line:#2c4058; --text:#e8eef5; --muted:#93a7bd; --faint:#6b8199;
  --accent:#4ea3ff; --accentbg:#16304d;
  --ok:#3ecf8e; --okbg:#123527; --warn:#f2b134; --warnbg:#3a2f10; --crit:#ff6b6b; --critbg:#3a1414;
  --s1:#4ea3ff; --s2:#f2a93b; --s3:#3cc5b5; --s4:#b08cff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
body.embed .wrap{padding-block:6px 40px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .code{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:15px;margin-left:8px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;vertical-align:3px}
.sub{color:var(--muted);font-size:13px}
.fresh{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.fresh b{color:var(--ok);font-weight:500}
.fresh b.old{color:var(--warn)}
nav{display:flex;gap:4px;overflow-x:auto;margin:16px 0 18px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);font:500 13.5px var(--sans);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
nav button:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .n{font-size:12px;color:var(--faint)}
.kpi.w .v{color:var(--warn)} .kpi.c .v{color:var(--crit)} .kpi.g .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px;text-wrap:balance}
.card .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.card .meta code,.note code,td code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.num,td.num{text-align:right}
th[data-dir="asc"]::after{content:" ▲";font-size:9px} th[data-dir="desc"]::after{content:" ▼";font-size:9px}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--panel2)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.75;vertical-align:middle;margin-left:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;letter-spacing:.02em}
.p-ok{background:var(--okbg);color:var(--ok)} .p-w{background:var(--warnbg);color:var(--warn)} .p-c{background:var(--critbg);color:var(--crit)} .p-a{background:var(--accentbg);color:var(--accent)} .p-n{background:var(--panel2);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:6px;padding:9px 12px;margin-top:10px;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .gl{stroke:var(--line);stroke-width:1}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px;margin:6px 0}
.flow span{padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}
.flow span.k{border-color:var(--accent);color:var(--accent)}
.flow em{color:var(--faint);font-style:normal}
.tabpanel[hidden]{display:none!important}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
@media (max-width:560px){h1{font-size:20px}.fresh{text-align:left}}
@media (prefers-reduced-motion:no-preference){.tabpanel{animation:fi .18s ease-out}@keyframes fi{from{opacity:.4}to{opacity:1}}}
</style></head><body>
<script id="pulse-data">window.PULSE=null;</script>
<div class="wrap">
<header>
  <div>
    <h1>WMS Pulse <span class="code">01 · Prishtinë</span></h1>
    <div class="sub">Tabelat dhe metrikat nga skill-i <code>gjirafa-wms-data-analyst</code>, të ekzekutuara në databazën WMS · rifreskohet automatikisht</div>
  </div>
  <div class="fresh" id="fresh"></div>
</header>

<nav role="tablist" id="tabs"></nav>
<div id="app"><div class="empty">Po ngarkohen të dhënat…</div></div>
</div>

<template id="tpl">
<!-- PRODUCTIVITY -->
<div class="tabpanel" id="t-prod">
  <div class="kpis" id="k-prod"></div>
  <section class="card">
    <h2>Operacione të peshuara për punëtor · 7 ditët e fundit (përfshirë sot)</h2>
    <div class="meta">Formula: <code>1.0×check-out + 0.8×check-in + 0.6×map</code> · LogType 2 / 7 / 4,18 · punëtorë me depo shtëpie 01 (pa llogari shitësish)</div>
    <div class="tw" id="tb-week"></div>
  </section>
  <section class="card">
    <h2>Brezat e performancës · 30 ditët e fundit</h2>
    <div class="meta">Ops të peshuara ÷ ditë aktive. Mesatarja e ekipit <b id="avgops"></b>, SD <b id="sdops"></b>. Above &gt; +25%, Below &lt; −25%, Spike &gt; +2 SD (<code>PerformanceSettings</code>). Të gjitha depot.</div>
    <div class="tw" id="tb-bands"></div>
    <div class="note">Punëtorët me 1–3 ditë aktive dalin shpesh "Spike" ose "Below" nga mostra e vogël. Llogaritë <code>temp…@</code> duken si login të përbashkët, ndaj një rresht mund të mbulojë disa njerëz.</div>
  </section>
  <section class="card">
    <h2>Rrjedha sipas orës · 14 ditë</h2>
    <div class="meta">Njësi të skanuara për orë lokale, të gjitha depot</div>
    <div class="legend"><span><i style="background:var(--s1)"></i>Check-in</span><span><i style="background:var(--s3)"></i>Map</span><span><i style="background:var(--s2)"></i>Check-out</span></div>
    <div class="tw" id="ch-hour"></div>
    <div class="note" id="n-hour"></div>
  </section>
</div>

<!-- PAY -->
<div class="tabpanel" id="t-pay" hidden>
  <div class="kpis" id="k-pay"></div>
  <div class="grid2">
    <section class="card">
      <h2>Kosto sipas veprimit · <span id="per-lbl"></span></h2>
      <div class="meta">Periudha e fundit e mbyllur e pagave, depo 01</div>
      <div class="tw" id="tb-period"></div>
    </section>
    <section class="card">
      <h2>Tarifat sipas versionit</h2>
      <div class="meta"><code>Çmimi = OrderCompletionPrice × Weight ÷ TotalWeight</code></div>
      <div class="tw" id="tb-rates"></div>
    </section>
  </div>
  <section class="card">
    <h2>Pagesa për punëtor · <span id="per-lbl2"></span></h2>
    <div class="meta">Nga <code>WarehouseActionPayments</code>. Orë standarde = sasia × <code>AverageTimeSeconds</code> ÷ 3600</div>
    <div class="tw" id="tb-pay"></div>
    <div class="note">Disa llogari janë email-e të shitësve (p.sh. gmail, pc-ks.net) që bëjnë check-in/out vetë te CHECKIN SELLERS. Ato nuk janë staf i magazinës. <code>Cost</code> është tashmë çmim × sasi, mos e shumëzo sërish. Periudha e muajit në vazhdim shfaqet kur WMS e llogarit (mujore).</div>
  </section>
</div>

<!-- ORDERS -->
<div class="tabpanel" id="t-ord" hidden>
  <div class="kpis" id="k-ord"></div>
  <section class="card">
    <h2>Porosi të pranuara kundrejt porosive me check-out · 14 ditë, depo 01</h2>
    <div class="meta">Pranuar sipas datës UTC, check-out sipas datës lokale. Check-out = porosi të dallueshme me LogType 4/18</div>
    <div class="legend"><span><i style="background:var(--s1)"></i>GjirafaMall</span><span><i style="background:var(--s4)"></i>Gjirafa50</span><span><i style="background:var(--s2)"></i>Me check-out</span></div>
    <div class="tw" id="ch-daily"></div>
  </section>
  <div class="grid2">
    <section class="card">
      <h2>Koha porosi → check-out i parë</h2>
      <div class="meta">Check-out-et e 14 ditëve, depo 01. Mesatarja anon nga porositë e gjata, shiko medianën dhe p90</div>
      <div class="tw" id="tb-o2c"></div>
    </section>
    <section class="card">
      <h2>Njësi për porosi · 30 ditë</h2>
      <div class="meta">Nga <code>OrderDetails.Quantity</code>, join me <code>(OrderId, PlatformId)</code></div>
      <div class="tw" id="tb-upo"></div>
    </section>
  </div>
  <section class="card">
    <h2>Porositë sipas statusit WMS · krijuar 30 ditët e fundit</h2>
    <div class="meta">Të gjitha depot. Statuset nuk kanë tabelë lookup; emrat vijnë nga <code>OrderStatusMapping.ShippingAttribute</code> kur ekzistojnë</div>
    <div class="tw" id="tb-status"></div>
    <div class="note">"Backlog" nuk llogaritet sepse nuk dihet cilat statuse janë përfundimtare (dorëzuar/anuluar). Kolonat &gt;24h dhe &gt;72h tregojnë kohën e pritjes së porosive në secilin status.</div>
  </section>
</div>

<!-- STOCK -->
<div class="tabpanel" id="t-stock" hidden>
  <div class="kpis" id="k-stock"></div>
  <div class="grid2">
    <section class="card">
      <h2>Gjendja aktuale e njësive · check-in 90 ditë</h2>
      <div class="meta"><code>ProductCheckIns.StatusId</code> = LogType i fundit i njësisë · depo 01</div>
      <div class="tw" id="tb-state"></div>
    </section>
    <section class="card">
      <h2>Koha check-in → map · 14 ditë</h2>
      <div class="meta">Mesatarja në orë nga check-in (2) te map-i i parë (7), sipas ditës së check-in, depo 01</div>
      <div class="tw" id="ch-dwell"></div>
    </section>
  </div>
  <section class="card">
    <h2>Njësi të mapuara sipas seksionit · top 25</h2>
    <div class="meta">StatusId 7, depo 01 · <code>Rows → Shelves → Sections</code></div>
    <div class="tw" id="tb-sect"></div>
    <div class="note" id="n-sect"></div>
  </section>
  <div class="grid2">
    <section class="card">
      <h2>Inventarizimet e mbyllura · depo 01</h2>
      <div class="meta">Skanuar = <code>InspectedProducts</code>, mungon = <code>InspectMissingProducts</code></div>
      <div class="tw" id="tb-insp"></div>
      <div class="note">Seancat me shumë "missing" dhe pak "scanned" janë numërime të pjesshme: pritshmëria mbulon gjithë depon, por u skanua vetëm një zonë. Saktësia ka kuptim vetëm për numërimet e plota.</div>
    </section>
    <section class="card">
      <h2>Diferenca WMS kundrejt QuickBooks · të pazgjidhura</h2>
      <div class="meta"><code>StockDifferences</code>, grupuar sipas kodit (disa regjistrime për kod)</div>
      <div class="tw" id="tb-diff"></div>
    </section>
  </div>
</div>

<!-- INBOUND -->
<div class="tabpanel" id="t-in" hidden>
  <div class="kpis" id="k-in"></div>
  <div class="grid2">
    <section class="card">
      <h2>Furnizime dhe njësi sipas javës · 8 javë + java aktuale</h2>
      <div class="meta"><code>Supplies</code> ⋈ <code>ProductCheckIns</code> në SupplyUniqueName · depo 01</div>
      <div class="tw" id="tb-sup"></div>
    </section>
    <section class="card">
      <h2>Mbërritja në kohë sipas transportuesit</h2>
      <div class="meta">Ndalesat me datë të pritur deri sot · krahasim sipas datës (vlerësimet janë ndonjëherë vetëm datë)</div>
      <div class="tw" id="tb-car"></div>
    </section>
  </div>
  <div class="grid2">
    <section class="card">
      <h2>Pick sessions · që nga 10.08.2026</h2>
      <div class="meta">Seancat e përfunduara (Status 2). Porositë dhe artikujt janë agreguar veçmas, pa fan-out</div>
      <div class="tw" id="tb-pick"></div>
      <div class="note">Kohëzgjatja mesatare prej ditësh do të thotë që seancat mbeten hapur pas punës. Vlerëso picking-un me <code>scanned ÷ required</code>, jo me minuta.</div>
    </section>
    <section class="card">
      <h2>Stacionet</h2>
      <div class="meta">Depo 01, pa stacionin <code>test</code> (Id 13)</div>
      <div class="tw" id="tb-st"></div>
    </section>
  </div>
  <section class="card">
    <h2>Faturat sipas muajit · 6 muaj</h2>
    <div class="meta"><code>Invoices</code> · StatusId 3 / 1 · SentToQbo = dërguar në QuickBooks Online</div>
    <div class="tw" id="tb-inv"></div>
    <div class="note" id="n-inv"></div>
  </section>
</div>

<!-- MODEL -->
<div class="tabpanel" id="t-model" hidden>
  <div class="grid2">
    <section class="card">
      <h2>Entitetet dhe çelësat</h2>
      <div class="meta">Nga <code>references/entities.md</code></div>
      <div class="tw" id="tb-ent"></div>
    </section>
    <section class="card">
      <h2>Kurthet e ID-ve</h2>
      <div class="meta">Gabimet që japin 0 rreshta ose dyfishime</div>
      <div class="tw" id="tb-trap"></div>
    </section>
  </div>
  <section class="card">
    <h2>Cikli i njësisë (LogTypeId)</h2>
    <div class="meta">Konfirmuar: 2 check-in · 7 map · 4/18 check-out. Të tjerët janë vetëm numra deri sa të merren nga enum-i i WMS</div>
    <div class="flow"><em>inbound</em><span class="k">2</span><em>→</em><span>6</span><em>→</em><span class="k">7</span><em>(7→7 = ri-map)</em></div>
    <div class="flow"><em>outbound</em><span class="k">2</span><em>→</em><span>3</span><em>→</em><span>27</span><em>→</em><span>9</span><em>→</em><span class="k">18</span><em>· i vjetër 9→4 ose 3→4</em></div>
    <div class="tw" id="tb-log"></div>
  </section>
  <div class="grid2">
    <section class="card">
      <h2>Depot</h2>
      <div class="tw" id="tb-wh"></div>
    </section>
    <section class="card">
      <h2>Freskia e të dhënave</h2>
      <div class="tw" id="tb-fresh"></div>
    </section>
  </div>
  <section class="card">
    <h2>Pyetje të hapura</h2>
    <div class="meta">Nga <code>references/open-questions.md</code>. Kur të plotësohen nga kodi i WMS, ky panel dhe etiketat e statuseve mund të emërtohen</div>
    <div class="tw" id="tb-oq"></div>
  </section>
</div>
</template>

<script>
const WH={1:"01 Prishtinë",5:"02 Tirana",6:"03 Skopje",11:"iGjirafa",12:"05 Prizren"};
const PL={1:"GjirafaMall",2:"Gjirafa50"};
const LT={2:"Check-in",7:"Map",4:"Check-out (i vjetër)",18:"Check-out"};
const MONTHS=["janar","shkurt","mars","prill","maj","qershor","korrik","gusht","shtator","tetor","nëntor","dhjetor"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d)=>v==null?"–":typeof v==="number"?v.toLocaleString("sq-AL",{minimumFractionDigits:d??0,maximumFractionDigits:d??2}):esc(v);
const pill=(t,c)=>`<span class="pill p-${c}">${esc(t)}</span>`;
const isTemp=u=>/^temp\d+@/.test(u);
const isExt=u=>/@/.test(u)&&!/@gjirafa\.com$/.test(u);
const who=u=>esc(u)+(isTemp(u)?" "+pill("temp","w"):isExt(u)?" "+pill("shitës","n"):"");
const dt=s=>{ if(!s) return "–"; const [d,t]=s.split("T"); const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}${t?" "+t.slice(0,5):""}`; };
const hh=h=>String(h).padStart(2,"0")+":00";

function table(id,cols,rows){
  const el=document.getElementById(id);
  if(!rows.length){ el.innerHTML='<div class="empty" style="padding:14px">S\'ka të dhëna.</div>'; return; }
  let sort={i:-1,dir:1};
  const maxes=cols.map((c,i)=>c.bar?Math.max(...rows.map(r=>Math.abs(+r[i]||0))):0);
  function draw(){
    let rs=rows.slice();
    if(sort.i>=0){rs.sort((a,b)=>{const x=a[sort.i],y=b[sort.i];if(x==null)return 1;if(y==null)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(String(y)))*sort.dir;});}
    el.innerHTML=`<table><thead><tr>${cols.map((c,i)=>`<th tabindex="0" class="${c.n?"num":""}" data-i="${i}" ${sort.i===i?`data-dir="${sort.dir>0?"asc":"desc"}"`:""}>${c.h}</th>`).join("")}</tr></thead><tbody>${
      rs.map(r=>`<tr>${cols.map((c,i)=>{const v=r[i];let h=c.f?c.f(v,r):fmt(v,c.d);
        if(c.bar&&maxes[i])h+=`<span class="bar" style="width:${Math.max(2,Math.abs(v||0)/maxes[i]*70)}px"></span>`;
        return `<td class="${c.n?"num":""}">${h}</td>`;}).join("")}</tr>`).join("")}</tbody></table>`;
    el.querySelectorAll("th").forEach(th=>{const go=()=>{const i=+th.dataset.i;sort=sort.i===i?{i,dir:-sort.dir}:{i,dir:typeof rows[0][i]==="number"?-1:1};draw();};th.onclick=go;th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
  }
  draw();
}
function kpis(id,items){document.getElementById(id).innerHTML=items.map(k=>`<div class="kpi ${k.c||""}"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="n">${k.n||""}</div></div>`).join("");}
function bars(id,labels,series,{stacked=false,h=220,yfmt=v=>fmt(v)}={}){
  if(!labels.length){ document.getElementById(id).innerHTML='<div class="empty" style="padding:14px">S\'ka të dhëna.</div>'; return; }
  const W=Math.max(560,labels.length*44),H=h,pl=46,pr=10,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const totals=labels.map((_,i)=>stacked?series.reduce((s,se)=>s+(se.data[i]||0),0):Math.max(...series.map(se=>se.data[i]||0)));

try{const s=localStorage.getItem("wmsTab");if(s&&TABS.some(([t])=>t===s))current=s;}catch(e){}
{ const h=location.hash.slice(1); if(h&&TABS.some(([t])=>t==="t-"+h)) current="t-"+h; }
if(/[?&]embed=1/.test(location.search)) document.body.classList.add("embed");
{ const m=/[?&]theme=(dark|light)/.exec(location.search); if(m) document.documentElement.dataset.theme=m[1]; }

// Data: embedded (published page) or from the local agent (app tab), re-read every 5 min.
let lastGen=null;
async function load(){
  if(window.PULSE){ if(lastGen!==window.PULSE.generatedAt){ lastGen=window.PULSE.generatedAt; render(window.PULSE); } return; }
  try{ const r=await fetch("/pulse/data",{cache:"no-store"}); const j=await r.json();
    if(!r.ok||j.error){ document.getElementById("app").innerHTML=`<div class="empty">${esc(j.error||("HTTP "+r.status))}</div>`; return; }
    if(lastGen!==j.generatedAt){ lastGen=j.generatedAt; render(j); }
  }catch(e){ document.getElementById("app").innerHTML=`<div class="empty">Agjenti s'përgjigjet (${esc(e.message)}).</div>`; }
}
load();
if(!window.PULSE) setInterval(load, 5*60*1000);
</script>
</body></html>
