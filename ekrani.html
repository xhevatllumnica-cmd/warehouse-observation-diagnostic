<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekrani — Tabela ditore · Proceset</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>">
<style>
/* Monitor rotation (the warehouse lead, 17.10.2026): the pages stay loaded side by side and only the visible one changes every N
   seconds, so a switch is instant and each page keeps refreshing its own data in the background.
   /ekrani?s=30&p=tabela,proceset — s = seconds per page (10–600), p = the pages in order. */
html,body{ margin:0; height:100%; background:#f4f5f7; overflow:hidden; font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
iframe{ position:fixed; inset:0; width:100%; height:100%; border:0; background:#f4f5f7; opacity:0; pointer-events:none; transition:opacity .5s; }
iframe.on{ opacity:1; pointer-events:auto; }
#bar{ position:fixed; right:12px; bottom:12px; z-index:10; display:flex; gap:6px; align-items:center; background:rgba(43,47,54,.82); color:#fff; padding:6px 8px; border-radius:10px; transition:opacity .4s; }
#bar.hide{ opacity:.25; }
#bar.hide:hover{ opacity:1; }
#bar button{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:7px; padding:4px 9px; font:inherit; cursor:pointer; }
#bar .lbl{ padding:0 4px; font-variant-numeric:tabular-nums; }
#prog{ position:fixed; left:0; bottom:0; height:3px; background:#e67e22; z-index:11; width:0; }
</style>
</head>
<body>
<div id="frames"></div>
<div id="prog"></div>
<div id="bar"><span class="lbl" id="lbl">—</span><button id="bPrev" title="Faqja e mëparshme">◀</button><button id="bPause" title="Ndalo / vazhdo">⏸</button><button id="bNext" title="Faqja tjetër">▶</button><button id="bFull" title="Ekran i plotë">⛶</button></div>
<script>
const PAGES={tabela:{url:'/tabela', name:'Tabela ditore'}, proceset:{url:'/proceset', name:'Proceset sipas operatorit'}, postat:{url:'/postat', name:'Postat'}};
const qs=new URLSearchParams(location.search);
const secs=Math.min(600, Math.max(10, parseInt(qs.get('s'))||30));
const list=(qs.get('p')||'tabela,proceset').split(',').map(s=>s.trim()).filter(k=>PAGES[k]);
const order=list.length? list : ['tabela','proceset'];
const fr=document.getElementById('frames');
const frames=order.map(k=>{ const f=document.createElement('iframe'); f.src=PAGES[k].url; f.title=PAGES[k].name; fr.appendChild(f); return f; });
let i=0, paused=false, t0=Date.now();
function show(n){ i=(n+frames.length)%frames.length; frames.forEach((f,j)=>f.classList.toggle('on', j===i)); t0=Date.now(); label(); }
function label(){ document.getElementById('lbl').textContent=PAGES[order[i]].name+(paused? ' · ndalur' : ' · '+Math.max(0,Math.ceil(secs-(Date.now()-t0)/1000))+' s'); }
setInterval(()=>{ const p=Math.min(1,(Date.now()-t0)/(secs*1000)); document.getElementById('prog').style.width= paused? '0' : (p*100)+'%';
  if(!paused && p>=1) show(i+1); else label(); }, 250);
document.getElementById('bNext').onclick=()=>show(i+1);
document.getElementById('bPrev').onclick=()=>show(i-1);
document.getElementById('bPause').onclick=e=>{ paused=!paused; e.target.textContent=paused? '▶︎ vazhdo' : '⏸'; t0=Date.now(); label(); };
document.getElementById('bFull').onclick=()=>{ const el=document.documentElement; if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen(); };
// the buttons fade after 5 s without the mouse, and come back when it moves
const bar=document.getElementById('bar'); let hideT=null; const wake=()=>{ bar.classList.remove('hide'); clearTimeout(hideT); hideT=setTimeout(()=>bar.classList.add('hide'), 5000); };
document.addEventListener('mousemove', wake); wake();
// keyboard: → / ← next / previous, space pause
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') show(i+1); else if(e.key==='ArrowLeft') show(i-1); else if(e.key===' '){ e.preventDefault(); document.getElementById('bPause').click(); } });
show(0);
</script>
</body>
</html>
