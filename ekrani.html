<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekrani — Tabela ditore · Proceset</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>">
<style>
/* Monitor rotation (the warehouse lead, 17.10.2026): the pages stay loaded side by side and only the visible one changes every N
   seconds, so a switch is instant and each page keeps refreshing its own data in the background.
   /ekrani?s=30&p=tabela,proceset — s = seconds per page (10–600), p = the pages in order. */
html,body{ margin:0; height:100%; background:#f4f5f7; overflow:hidden; font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
iframe{ position:fixed; inset:var(--m,0); width:calc(100% - 2*var(--m,0)); height:calc(100% - 2*var(--m,0)); border:0; background:#f4f5f7; opacity:0; pointer-events:none; transition:opacity .5s; }
iframe.on{ opacity:1; pointer-events:auto; }
#bar{ position:fixed; right:12px; bottom:12px; z-index:10; display:flex; gap:6px; align-items:center; background:rgba(43,47,54,.82); color:#fff; padding:6px 8px; border-radius:10px; transition:opacity .4s; }
#bar.hide{ opacity:.25; }
#bar.hide:hover{ opacity:1; }
#bar button{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:7px; padding:4px 9px; font:inherit; cursor:pointer; }
#bar .lbl{ padding:0 4px; font-variant-numeric:tabular-nums; }
#prog{ position:fixed; left:0; bottom:0; height:3px; background:#e67e22; z-index:11; width:0; }
</style>
</head>
<body>
<div id="frames"></div>
<div id="prog"></div>
<div id="bar"><span class="lbl" id="lbl">—</span><button id="bPrev" title="Faqja e mëparshme">◀</button><button id="bPause" title="Ndalo / vazhdo">⏸</button><button id="bNext" title="Faqja tjetër">▶</button><button id="bMinus" title="Më pak diferencë anash">−</button><span class="lbl" id="mLbl" title="Diferenca anash (për TV me overscan)">0%</span><button id="bPlus" title="Më shumë diferencë anash — nëse skajet dalin jashtë TV-së">+</button><button id="bFull" title="Ekran i plotë">⛶</button></div>
<script>
const PAGES={tabela:{url:'/tabela?kiosk=1', name:'Tabela ditore'}, proceset:{url:'/proceset?kiosk=1', name:'Proceset sipas operatorit'}, postat:{url:'/postat?kiosk=1', name:'Postat'}};
const qs=new URLSearchParams(location.search);
const secs=Math.min(600, Math.max(10, parseInt(qs.get('s'))||30));
const list=(qs.get('p')||'tabela,proceset').split(',').map(s=>s.trim()).filter(k=>PAGES[k]);
const order=list.length? list : ['tabela','proceset'];
const fr=document.getElementById('frames');
const frames=order.map(k=>{ const f=document.createElement('iframe'); f.src=PAGES[k].url; f.title=PAGES[k].name; fr.appendChild(f); return f; });
let i=0, paused=false, t0=Date.now();
function show(n){ i=(n+frames.length)%frames.length; frames.forEach((f,j)=>f.classList.toggle('on', j===i)); t0=Date.now(); label(); }
function label(){ document.getElementById('lbl').textContent=PAGES[order[i]].name+(paused? ' · ndalur' : ' · '+Math.max(0,Math.ceil(secs-(Date.now()-t0)/1000))+' s'); }
setInterval(()=>{ const p=Math.min(1,(Date.now()-t0)/(secs*1000)); document.getElementById('prog').style.width= paused? '0' : (p*100)+'%';
  if(!paused && p>=1) show(i+1); else label(); }, 250);
document.getElementById('bNext').onclick=()=>show(i+1);
document.getElementById('bPrev').onclick=()=>show(i-1);
document.getElementById('bPause').onclick=e=>{ paused=!paused; e.target.textContent=paused? '▶︎ vazhdo' : '⏸'; t0=Date.now(); label(); };
document.getElementById('bFull').onclick=()=>{ const el=document.documentElement; if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen(); };
// the buttons fade after 5 s without the mouse, and come back when it moves
const bar=document.getElementById('bar'); let hideT=null; const wake=()=>{ bar.classList.remove('hide'); clearTimeout(hideT); hideT=setTimeout(()=>bar.classList.add('hide'), 5000); };
document.addEventListener('mousemove', wake); wake();
// keyboard: → / ← next / previous, space pause
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') show(i+1); else if(e.key==='ArrowLeft') show(i-1); else if(e.key===' '){ e.preventDefault(); document.getElementById('bPause').click(); } });
/* fit each page to the monitor (the lead, 19.10.2026): the page's own size is measured at zoom 1 and the whole page is zoomed down
   so it fits the screen without scrolling (never up). Measured and set in one step, so nothing flickers; again every 5 s (the data
   changes the height), on load and on resize. */
function fit(f){ try{ const doc=f.contentDocument; if(!doc || !doc.documentElement || !doc.body) return; const el=doc.documentElement;
  el.style.overflow='hidden'; el.style.zoom='1';
  const W=f.clientWidth, H=f.clientHeight, w=Math.max(el.scrollWidth, doc.body.scrollWidth), hh=Math.max(el.scrollHeight, doc.body.scrollHeight);
  const z=Math.min(1, W/w, H/hh); el.style.zoom= z<0.999? String(Math.floor(z*1000)/1000) : '1'; }catch(e){} }
const fitAll=()=>frames.forEach(fit);
frames.forEach(f=>f.addEventListener('load', ()=>{ fit(f); setTimeout(()=>fit(f), 1500); }));
setInterval(fitAll, 5000); addEventListener('resize', fitAll); document.addEventListener('fullscreenchange', ()=>setTimeout(fitAll, 300));
/* TV overscan (the lead, 19.10.2026: the screen is a TV — it crops the edges): a margin on every side, 0–10 % of the screen, set with
   − / + and kept on this PC (localStorage); ?m=4 in the address sets it too. The pages are fitted inside it. */
let M=0; try{ M=parseFloat(localStorage.getItem('ekraniMargin'))||0; }catch(e){}
if(qs.get('m')!=null) M=parseFloat(qs.get('m'))||0;
function setM(v){ M=Math.max(0, Math.min(10, Math.round(v))); document.documentElement.style.setProperty('--m', M+'vmin');
  document.getElementById('mLbl').textContent=M+'%'; try{ localStorage.setItem('ekraniMargin', String(M)); }catch(e){} setTimeout(fitAll, 50); }
document.getElementById('bMinus').onclick=()=>setM(M-1);
document.getElementById('bPlus').onclick=()=>setM(M+1);
setM(M);
show(0);
</script>
</body>
</html>
